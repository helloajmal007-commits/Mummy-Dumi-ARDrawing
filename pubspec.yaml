name: sketch_flow
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.2+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  google_fonts: ^8.2.0
  flutter_svg: ^2.3.0
  uuid: ^4.6.0
  get_storage: ^2.1.1
  camera: ^0.12.0+2
  image_picker: ^1.2.3
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  firebase_core: ^4.12.1
  gal: ^2.3.3
  pdf: ^3.13.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8
  firebase_crashlytics: ^5.2.7
  flutter_launcher_icons: ^0.14.4
  package_info_plus: ^10.2.1
  google_mobile_ads: ^5.2.0
  firebase_remote_config: ^6.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/categories/anime/
    - assets/categories/cartoon/
    - assets/categories/portrait/
    - assets/categories/animals/
    - assets/categories/nature/
    - assets/categories/objects/
    - assets/tutorials/draw-a-face/
    - assets/tutorials/draw-a-cat/
    - assets/tutorials/shading-basics/
    - assets/tutorials/draw-a-house/
    - assets/tutorials/draw-a-tree/
    - assets/tutorials/draw-a-hand/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
